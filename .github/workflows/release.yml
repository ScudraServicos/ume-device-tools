# Publishes a GitHub release when an infrasec member pushes a signed tag
# v<VERSION> (only infrasec can push tags). The workflow never creates tags.
# Steps for maintainers: RELEASING.md.
#
#   1. Checks the tag: name vYYYY.MM.DD[.N], annotated, signature verified by
#      GitHub, on a commit already in main (merged through a pull request).
#   2. Runs every test on the tagged commit (test.yml).
#   3. Checks that VERSION in both scripts matches the tag, attaches both
#      scripts and their SHA-256, and marks the release as latest.
#
# These links then always serve the latest release:
#   https://github.com/ScudraServicos/ume-device-tools/releases/latest/download/device-tools.sh
#   https://github.com/ScudraServicos/ume-device-tools/releases/latest/download/device-tools.ps1
#
# To retry for a tag that already exists: Actions > release > Run workflow,
# branch main, tag v<VERSION>.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed tag to publish, e.g. v2026.11.05.2 (create and push it first: RELEASING.md)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Signed tag, on a commit already in main
        id: tag
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]] ||
            { echo "::error::bad tag name '$TAG': use v<VERSION>, e.g. v2026.11.06 (RELEASING.md)"; exit 1; }
          if ! obj="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2>&1)"; then
            if printf '%s' "$obj" | grep -q 'HTTP 404'; then
              echo "::error::tag $TAG does not exist. This workflow never creates tags: create the signed tag on main and push it first (RELEASING.md, step 5)."
            else
              echo "::error::could not read tag $TAG: $obj"
            fi
            exit 1
          fi
          [ "${obj%% *}" = tag ] ||
            { echo "::error::$TAG is not an annotated tag: create it with 'git tag -s' (RELEASING.md, step 5)"; exit 1; }
          info="$(gh api "repos/$REPO/git/tags/${obj#* }" --jq '[.verification.verified, .verification.reason, .object.type, .object.sha] | @tsv')"
          IFS=$'\t' read -r verified reason type sha <<<"$info"
          [ "$verified" = true ] ||
            { echo "::error::$TAG signature is not verified by GitHub ($reason): sign it with a key added to your GitHub account as a signing key (RELEASING.md)"; exit 1; }
          [ "$type" = commit ] || { echo "::error::$TAG must point to a commit (found: $type)"; exit 1; }
          status="$(gh api "repos/$REPO/compare/$sha...main" --jq .status)"
          case "$status" in
            identical | ahead) ;;
            *) echo "::error::$TAG points to $sha, which is not in main ($status): merge the pull request first, then tag main (RELEASING.md)"; exit 1 ;;
          esac
          echo "$TAG: signed, verified, commit $sha is in main."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  test:
    needs: tag
    uses: ./.github/workflows/test.yml
    with:
      sha: ${{ needs.tag.outputs.sha }}
    permissions: {}

  release:
    needs: [tag, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release for the existing tag and upload its files; nothing else
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
      SHA: ${{ needs.tag.outputs.sha }}
    steps:
      - name: Get the tagged commit (no third-party actions)
        run: |
          set -euo pipefail
          git init --quiet src
          git -C src fetch --quiet --depth 1 "https://github.com/$REPO.git" "$SHA"
          git -C src -c advice.detachedHead=false checkout --quiet FETCH_HEAD

      - name: Both scripts carry the tag's version
        run: |
          set -euo pipefail
          sh_ver="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' src/device-tools.sh)"
          ps_ver="$(awk -F"'" '/^\$Version = /{ print $2; exit }' src/device-tools.ps1)"
          if [ "v$sh_ver" != "$TAG" ] || [ "v$ps_ver" != "$TAG" ]; then
            echo "::error::$TAG does not match the scripts (device-tools.sh $sh_ver, device-tools.ps1 $ps_ver): tag the commit whose VERSION is ${TAG#v}"
            exit 1
          fi
          for f in device-tools.sh device-tools.ps1; do
            cp "src/$f" .
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      - name: Publish the release, marked as latest
        run: |
          set -euo pipefail
          sum_sh="$(cut -d' ' -f1 device-tools.sh.sha256)"
          sum_ps1="$(cut -d' ' -f1 device-tools.ps1.sha256)"
          pr="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].html_url // empty' 2>/dev/null || true)"
          latest="https://github.com/$REPO/releases/latest/download"
          cat > notes.md <<EOF
          Run the latest version (these commands never change).

          macOS and Linux (Terminal):

          \`\`\`bash
          f=\$(mktemp) && curl -fsSL $latest/device-tools.sh -o "\$f" && sudo bash "\$f"
          \`\`\`

          Windows (PowerShell; open it as administrator to check every user):

          \`\`\`powershell
          [Net.ServicePointManager]::SecurityProtocol='Tls12'; \$f="\$env:TEMP\device-tools.ps1"; iwr -UseBasicParsing $latest/device-tools.ps1 -OutFile \$f; if (\$?) { powershell -NoProfile -ExecutionPolicy Bypass -File \$f }
          \`\`\`

          This exact version:

          - https://github.com/$REPO/releases/download/$TAG/device-tools.sh (SHA-256 \`$sum_sh\`, also in \`device-tools.sh.sha256\`)
          - https://github.com/$REPO/releases/download/$TAG/device-tools.ps1 (SHA-256 \`$sum_ps1\`, also in \`device-tools.ps1.sha256\`)

          Signed tag $TAG on commit $SHA${pr:+ (pull request $pr)}; every test passed on that commit.
          EOF
          gh release create "$TAG" device-tools.sh device-tools.sh.sha256 device-tools.ps1 device-tools.ps1.sha256 \
            --repo "$REPO" --verify-tag --latest --title "$TAG" --notes-file notes.md
          gh release view "$TAG" --repo "$REPO" --json tagName,assets --jq '[.tagName, (.assets | map(.name) | join(" "))] | join(": ")'
          [ "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG" ] ||
            { echo "::error::$TAG was published but is not the latest release"; exit 1; }
