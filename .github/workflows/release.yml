# Publishes a release on its own after a pull request is merged into main.
# Nobody creates tags by hand: see RELEASING.md for the steps.
#
#   1. Runs every test again on the merged commit (test.yml).
#   2. Reads VERSION from the scripts. If v<VERSION> is not released yet, it
#      creates that tag on the merged commit, attaches both scripts and their
#      SHA-256, and marks the release as latest. A merge that keeps VERSION
#      (only docs or workflows changed) publishes nothing.
#
# These links then always serve the latest release:
#   https://github.com/ScudraServicos/ume-device-tools/releases/latest/download/device-tools.sh
#   https://github.com/ScudraServicos/ume-device-tools/releases/latest/download/device-tools.ps1
#
# To retry a failed run: Actions > release > Run workflow, branch main.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions: {}

  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release, upload their files; nothing else
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: Get the merged commit (no third-party actions)
        run: |
          set -euo pipefail
          git init --quiet src
          git -C src fetch --quiet --depth 1 "https://github.com/$REPO.git" "$SHA"
          git -C src -c advice.detachedHead=false checkout --quiet FETCH_HEAD

      - name: Check the commit and whether its version is new
        id: check
        run: |
          set -euo pipefail
          verified="$(gh api "repos/$REPO/commits/$SHA" --jq .commit.verification.verified)"
          [ "$verified" = true ] || { echo "::error::commit $SHA is not signed and verified by GitHub"; exit 1; }
          ver="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' src/device-tools.sh)"
          tag="v$ver"
          [[ "$tag" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]] || { echo "::error::bad VERSION: $ver"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if out="$(gh api "repos/$REPO/git/ref/tags/$tag" 2>&1)"; then
            echo "::notice::$tag is already released, so there is nothing to publish. To release a change, raise VERSION in both scripts (RELEASING.md)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q 'HTTP 404'; then
            echo "$tag is new: publishing it."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not check tag $tag: $out"; exit 1
          fi

      - name: Publish the release, marked as latest
        if: steps.check.outputs.publish == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          for f in device-tools.sh device-tools.ps1; do
            cp "src/$f" .
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256"
          done
          sum_sh="$(cut -d' ' -f1 device-tools.sh.sha256)"
          sum_ps1="$(cut -d' ' -f1 device-tools.ps1.sha256)"
          pr="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].html_url // empty' 2>/dev/null || true)"
          latest="https://github.com/$REPO/releases/latest/download"
          cat > notes.md <<EOF
          Run the latest version (these commands never change).

          macOS and Linux (Terminal):

          \`\`\`bash
          f=\$(mktemp) && curl -fsSL $latest/device-tools.sh -o "\$f" && sudo bash "\$f"
          \`\`\`

          Windows (PowerShell; open it as administrator to check every user):

          \`\`\`powershell
          [Net.ServicePointManager]::SecurityProtocol='Tls12'; \$f="\$env:TEMP\device-tools.ps1"; iwr -UseBasicParsing $latest/device-tools.ps1 -OutFile \$f; if (\$?) { powershell -NoProfile -ExecutionPolicy Bypass -File \$f }
          \`\`\`

          This exact version:

          - https://github.com/$REPO/releases/download/$TAG/device-tools.sh (SHA-256 \`$sum_sh\`, also in \`device-tools.sh.sha256\`)
          - https://github.com/$REPO/releases/download/$TAG/device-tools.ps1 (SHA-256 \`$sum_ps1\`, also in \`device-tools.ps1.sha256\`)

          Built from commit $SHA${pr:+ (pull request $pr)}, after every test passed.
          EOF
          gh release create "$TAG" device-tools.sh device-tools.sh.sha256 device-tools.ps1 device-tools.ps1.sha256 \
            --repo "$REPO" --target "$SHA" --latest --title "$TAG" --notes-file notes.md
          gh release view "$TAG" --repo "$REPO" --json tagName,assets --jq '[.tagName, (.assets | map(.name) | join(" "))] | join(": ")'
          [ "$(gh api "repos/$REPO/releases/latest" --jq .tag_name)" = "$TAG" ] ||
            { echo "::error::$TAG was published but is not the latest release"; exit 1; }
